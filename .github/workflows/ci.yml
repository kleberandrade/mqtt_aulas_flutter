name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: docker compose up -d --wait
      - run: flutter test --concurrency=1 --dart-define=LOCAL_BROKER=true test/integration
      - name: Browser WebSocket roundtrip
        run: flutter test --platform chrome --dart-define=LOCAL_BROKER=true test/integration/broker_test.dart
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
      - run: dart run tool/telemetry.dart
      - run: flutter build web --release
      - name: Broker diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test broker
        if: always()
        run: docker compose down
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
