name: Release
on:
  push:
    tags: ['v*']
  # Manual runs prepare downloadable artifacts; they never publish a release.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      upload_apk: true
  package:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-debug-apk
          path: .dart_tool/release-input
      - name: Prepare versioned APK, checksum and English notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m tool.prepare_release \
            --apk .dart_tool/release-input/app-debug.apk \
            --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" \
            --repository "$REPOSITORY" --run-id "$RUN_ID"
          cd .dart_tool/release
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: .dart_tool/release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: .dart_tool/release
      - name: Publish complete release with debug assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -m tool.publish_release .dart_tool/release
