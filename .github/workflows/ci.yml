name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      upload_apk:
        description: Retain the Android debug APK for the calling release workflow.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: python3 -m unittest discover -s tool/tests -v
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: docker compose up -d --wait
      - run: flutter test --concurrency=1 --dart-define=LOCAL_BROKER=true test/integration
      - name: Browser WebSocket roundtrip
        run: flutter test --platform chrome --dart-define=LOCAL_BROKER=true test/integration/broker_test.dart
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
      - run: dart run tool/telemetry.dart
      - run: flutter build web --release
      - name: Broker diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test broker
        if: always()
        run: docker compose down
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: Retain APK for release packaging
        if: inputs.upload_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          overwrite: true
